name: Build & Publish Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Tag versi rilis (contoh: v1.2.0)"
        required: true
        default: "v1.2.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Determine release tag & output APK filename
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ inputs.version_tag }}"
          fi
          DATE_STAMP=$(date -u +"%Y%m%d")
          CLEAN_TAG=$(echo "$TAG_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')
          APK_NAME="OfflineSubPlayer-${CLEAN_TAG}-${DATE_STAMP}.apk"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Ensure CI debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK
        id: artifact
        run: |
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          DEST_APK="app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}"
          cp "$SRC_APK" "$DEST_APK"
          echo "apk_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.artifact.outputs.apk_path }}

      - name: Publish GitHub Release
        if: startsWith(steps.meta.outputs.tag_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "SubPlayer Offline & Online ${{ steps.meta.outputs.tag_name }}"
          files: ${{ steps.artifact.outputs.apk_path }}
          generate_release_notes: true
